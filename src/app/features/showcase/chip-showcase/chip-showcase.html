<div class="showcase-page">
  <div class="page-heading">
    <div>
      <div class="eyebrow">COMPONENTS /</div>
      <h1>Chip</h1>
      <p>A flexible component for entering, displaying and managing tags.</p>
    </div>
  </div>

  <section class="demo-card">
    <div class="demo-preview">
      <div class="preview-label">CHIP INPUT</div>
      <div class="chip-wrapper">
        <zr-chip controlSize="large" placeholder="Add project tags" [removable]="true"></zr-chip>
      </div>
      <div></div>
    </div>
  </section>
  <div class="page-heading">
    <div>
      <h1>Checkbox</h1>
    </div>
  </div>

  <section class="demo-card">
    <div class="demo-preview">
      <div class="preview-label">Checkbox</div>
      <div class="chip-wrapper">
        <zr-checkbox
          [checked]="true"
          [label]="'Enable notifications'"
          [disabled]="false"
          [inputId]="'checkbox-default'"
          (checkedChange)="checkedChange($event)"
        ></zr-checkbox>
      </div>
    </div>
  </section>
</div>
